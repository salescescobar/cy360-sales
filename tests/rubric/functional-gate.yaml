threshold: 90
core:
  - { id: loads_fast,          blocker: true,  desc: "Dashboard loads under 3s, no console errors" }
  - { id: admin_provisions,    blocker: true,  desc: "Admin signs in with the seeded credentials from README and can create a manager account. There must be NO public self-service signup link on /login" }
  - { id: upload_flow,         blocker: true,  desc: "Upload a CSV at /import: source and dates are detected, a preview of parsed totals is shown, and data only lands after confirming" }
  - { id: upload_visible,      blocker: true,  desc: "After confirming an upload, those totals appear on the dashboard for that date without any terminal step" }
  - { id: reupload_replaces,   blocker: true,  desc: "Re-uploading the same date replaces the row and the preview warns about it — no duplicated totals" }
  - { id: bad_file_rejected,   blocker: true,  desc: "A malformed or empty CSV is rejected with a specific message and writes nothing" }
  - { id: location_isolation,  blocker: true,  desc: "SHALL NEVER 1: a manager signed in for Orlando cannot see another location, including by editing the URL" }
  - { id: admin_pages_guarded, blocker: true,  desc: "SHALL NEVER 5: /import and /admin are refused for a manager session and for no session" }
  - { id: daily_view,          blocker: true,  desc: "Day view shows totals and per-source breakdown for a date that has data" }
  - { id: monthly_like4like,   blocker: true,  desc: "Month view compares the same number of elapsed days against the prior month and labels it in words — a full-vs-partial percentage is a FAILURE" }
  - { id: incomplete_day,      blocker: true,  desc: "A date with only one source is labelled incomplete and excluded from comparatives" }
  - { id: clear_errors,        blocker: true,  desc: "Errors and unauthenticated access show accurate human messages, never a stack trace or a misleading claim" }
  - { id: hostile_inputs,      blocker: true,  desc: "Malformed dates, path-traversal strings, 10k-char inputs and a 10MB file return clean errors, never a crash" }
  - { id: security_gate,       blocker: true,  desc: "Secret scan, dependency audit and destructive-op linter green" }
  - { id: responsive,          blocker: false, desc: "Usable at 390px and desktop" }
holdout_pool:
  - { id: h_refresh_mid_flow, desc: "Reloading mid-flow preserves the selected view and date" }
  - { id: h_deep_link,        desc: "A deep link to an inner page renders or redirects sensibly, never a raw 404" }
  - { id: h_empty_state,      desc: "A date with no data explains itself instead of looking broken" }
  - { id: h_double_submit,    desc: "Double-clicking confirm does not write the same upload twice" }
  - { id: h_back_button,      desc: "Browser back behaves sanely after an upload" }
  - { id: h_stale_session,    desc: "A cleared session sends the user to sign in with an accurate message" }
